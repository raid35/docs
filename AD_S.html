<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Siksa TV Pro - Vivid Colors</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.15.9/shaka-player.ui.min.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.15.9/controls.min.css" rel="stylesheet">
    <style>
        body, html { margin: 0; padding: 0; background: #000; width: 100%; height: 100%; overflow: hidden; }
        .shaka-video-container { width: 100%; height: 100%; }

        video { 
            width: 100%; 
            height: 100%; 
            object-fit: contain;
            filter: contrast(1.1) saturate(1.2) brightness(1.05);
            image-rendering: -webkit-optimize-contrast;
            image-rendering: crisp-edges;
        }

        .shaka-spinner-container {
            width: 100% !important; height: 100% !important;
            display: flex; justify-content: center; align-items: center;
        }
        .shaka-spinner {
            width: 75px !important; height: 75px !important;
            border-width: 6px !important;
            border-top-color: #ff6b35 !important;
        }
        
        .shaka-bottom-controls { direction: ltr; padding-bottom: 20px; }
    </style>
</head>
<body>

    <div data-shaka-player-container class="shaka-video-container">
        <video id="dash-video" data-shaka-player autoplay crossorigin="anonymous" playsinline></video>
    </div>

    <script>
        const channelList = {
            "sps1": {
                url: "https://sps1.starzplayarabia.com/out/v1/eee188845e9543699fd24e5a9890c6e2/index.mpd",
                kid: "b253c726c24c7c94a3ddf9b1907e2c76",
                key: "097963d6ad73c3d712a104981de0ed42"
            },
            "sps2": {
                url: "https://sps2.starzplayarabia.com/out/v1/15e7d1ffb99746dda03f71dbbbc3c08b/index.mpd",
                kid: "ee861edcd99093153a763a94b14c2c5a",
                key: "ab3991f6a7729ba1ea4bcdba0c1ae6c0"
            },
            "ADS1": {
                url: "https://admn-live-cdn-lb.starzplayarabia.com/out/v1/admn_tv/abudhabi_sports_1/abudhabi_sports_1_dash_enc/index.mpd",
                kid: "e78769d87a41e15036a4fb8bfdf1371e",
                key: "37be0375dc9fe544c3c6de6a105f7c0a"
            },        
            "ADS2": {
                url: "https://admn-live-cdn-lb.starzplayarabia.com/out/v1/admn_tv/abudhabi_sports_2/abudhabi_sports_2_dash_enc/index.mpd",
                kid: "386a5e1166d9102709888c3468ce1f56", 
                key: "73bd0bd25a148b3a80116ecdd085ead6"
            },
            "BEIN1": {
                url: "https://a166aivottlinear-a.akamaihd.net/OTTB/syd-nitro/live/clients/dash/enc/ghwcl6hv68/out/v1/83536910d8034e9b9895a20fbe1c1687/cenc.mpd",
                kid: "335dad778109954503dcbb21dc92015f",
                key: "24bfd75d436cbf73168a2a2dccd40281"
            },
            "BEIN2": {
                url: "https://a151aivottlinear-a.akamaihd.net/OTTB/sin-nitro/live/dash/enc/8m8cd46i1t/out/v1/83985c68e4174e90a58a1f2c024be4c9/cenc.mpd",
                kid: "0b42be2664d7e811d04f3e504e0924c5",
                key: "ae24090123b8c72ac5404dc152847cb8"
            },
            "BEIN3": {
                url: "https://a166aivottlinear-a.akamaihd.net/OTTB/syd-nitro/live/clients/dash/enc/q4u5nwaogz/out/v1/18de6d3e65934f3a8de4358e69eab86c/cenc.mpd",
                kid: "7995c724a13748ed970840a8ab5bb9b3",
                key: "67bdaf1e2175b9ff682fcdf0e2354b1e"
            }
        };

        async function initPlayer() {
            const video = document.getElementById('dash-video');
            const ui = video['ui'];
            const controls = ui.getControls();
            const player = controls.getPlayer();

            const params = new URLSearchParams(window.location.search);
            const channelId = params.get('id') || "sps1";
            const channel = channelList[channelId];

            if (!channel) return;

            const drmConfig = {};
            drmConfig[channel.kid] = channel.key;

            player.configure({
                drm: { clearKeys: drmConfig },
                abr: { enabled: true, switchInterval: 1 },
                streaming: {
                    bufferingGoal: 45,
                    rebufferingGoal: 2,
                    lowLatencyEnabled: true
                }
            });

            try {
                await player.load(channel.url);
            } catch (e) { 
                console.error('Load Error:', e); 
            }
        }

        document.addEventListener('shaka-ui-loaded', initPlayer);
    </script>
</body>
</html>
