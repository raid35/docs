<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Siksa TV Pro - Vivid Colors</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.15.9/shaka-player.ui.min.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.15.9/controls.min.css" rel="stylesheet">
    <style>
        body, html { 
            margin: 0; 
            padding: 0; 
            background: #000; 
            width: 100%; 
            height: 100%; 
            overflow: hidden; 
        }

        .shaka-video-container { 
            width: 100%; 
            height: 100%; 
        }

        /* --- تحسين الأداء وتفعيل التسريع العتادي (Hardware Acceleration) --- */
        video { 
            width: 100%; 
            height: 100%; 
            object-fit: contain;
            transform: translateZ(0); /* تفعيل التسريع بواسطة GPU مباشرة */
            will-change: transform;
        }

        /* تنسيق دائرة التحميل */
        .shaka-spinner-container {
            width: 100% !important; 
            height: 100% !important;
            display: flex; 
            justify-content: center; 
            align-items: center;
        }
        .shaka-spinner {
            width: 75px !important; 
            height: 75px !important;
            border-width: 6px !important;
            border-top-color: #ff6b35 !important;
        }
        
        .shaka-bottom-controls { 
            direction: ltr; 
            padding-bottom: 20px; 
        }
    </style>
</head>
<body>

    <div data-shaka-player-container class="shaka-video-container">
        <video id="dash-video" data-shaka-player autoplay crossorigin="anonymous" playsinline></video>
    </div>

    <script>
        const channelList = {
            "sps1": {
                url: "https://sps1.starzplayarabia.com/out/v1/eee188845e9543699fd24e5a9890c6e2/index.mpd",
                kid: "b253c726c24c7c94a3ddf9b1907e2c76",
                key: "097963d6ad73c3d712a104981de0ed42"
            },
            "sps2": {
                url: "https://sps2.starzplayarabia.com/out/v1/15e7d1ffb99746dda03f71dbbbc3c08b/index.mpd",
                kid: "ee861edcd99093153a763a94b14c2c5a",
                key: "ab3991f6a7729ba1ea4bcdba0c1ae6c0"
            },
            "ADS1": {
                url: "https://admn-live-cdn-lb.starzplayarabia.com/out/v1/admn_tv/abudhabi_sports_1/abudhabi_sports_1_dash_enc/index.mpd",
                kid: "e78769d87a41e15036a4fb8bfdf1371e",
                key: "37be0375dc9fe544c3c6de6a105f7c0a"
            },        
            "ADS2": {
                url: "https://admn-live-cdn-lb.starzplayarabia.com/out/v1/admn_tv/abudhabi_sports_2/abudhabi_sports_2_dash_enc/index.mpd",
                kid: "386a5e1166d9102709888c3468ce1f56", 
                key: "73bd0bd25a148b3a80116ecdd085ead6"
            }
        };

        let controls; // متغيرة عامة لاستخدام عناصر التحكم بالريموت

        async function initPlayer() {
            const video = document.getElementById('dash-video');
            const ui = video['ui'];
            controls = ui.getControls();
            const player = controls.getPlayer();

            const params = new URLSearchParams(window.location.search);
            const channelId = params.get('id') || "sps1";
            const channel = channelList[channelId];

            if (!channel) return;

            // فلتر ترويسة الطلبات
            player.getNetworkingEngine().registerRequestFilter(function(type, request) {
                request.headers['User-Agent'] = 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36';
            });

            const drmConfig = {};
            drmConfig[channel.kid] = channel.key;

            player.configure({
                drm: { clearKeys: drmConfig },
                
                // تحسينات التبديل التلقائي للجودة (ABR) لتقليل الضغط
                abr: { 
                    enabled: true, 
                    switchInterval: 8, 
                    defaultBandwidthEstimate: 10000000 
                },
                
                // إعدادات البفر الخاصة بالأجهزة والتلفاز
                streaming: {
                    bufferingGoal: 20,       
                    rebufferingGoal: 4,      
                    bufferBehind: 10,        
                    lowLatencyMode: false,   
                    safeSeekOffset: 5
                }
            });

            try {
                await player.load(channel.url);
            } catch (e) { 
                console.error('Load Error:', e); 
            }
        }

        document.addEventListener('shaka-ui-loaded', initPlayer);

        /* ==========================================================
           مُستمع أزرار الريموت كنترول (D-Pad Control Listener)
           ========================================================== */
        document.addEventListener('keydown', (e) => {
            const video = document.getElementById('dash-video');
            if (!video) return;

            // إظهار شريط التحكم عند الضغط على أي زر في الريموت
            if (controls) {
                controls.getControlsContainer().classList.remove('shaka-controls-hidden');
            }

            switch(e.keyCode) {
                case 13: // Enter / OK (زر التحديد المنتصف)
                case 19: // Pause
                case 20: // Play
                case 126: // Play/Pause Media
                    if (video.paused) {
                        video.play();
                    } else {
                        video.pause();
                    }
                    break;

                case 37: // Left Arrow - إرجاع 10 ثوانٍ
                    video.currentTime = Math.max(0, video.currentTime - 10);
                    break;

                case 39: // Right Arrow - تقديم 10 ثوانٍ
                    video.currentTime = Math.min(video.duration, video.currentTime + 10);
                    break;

                case 38: // Up Arrow - رفع الصوت
                    video.volume = Math.min(1, video.volume + 0.1);
                    break;

                case 40: // Down Arrow - خفض الصوت
                    video.volume = Math.max(0, video.volume - 0.1);
                    break;
            }
        });
    </script>
</body>
</html>
