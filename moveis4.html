<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>مشغل الأفلام</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      direction: rtl;
      background: linear-gradient(-45deg, #1e3c72, #2a5298, #000000, #3b1d56);
      background-size: 400% 400%;
      animation: gradientAnimation 10s ease infinite;
      color: white;
      margin: 0;
      display: flex;
      height: 100vh;
      overflow: hidden;
    }
    @keyframes gradientAnimation {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }
    .sidebar {
      width: 300px;
      background: rgba(30, 30, 30, 0.9);
      padding: 15px;
      overflow-y: auto;
      border-right: 3px solid #333;
    }
    .category, .movie-item {
      background: #e91e63; /* لون مختلف قليلاً للأفلام لتغيير الجو */
      padding: 15px;
      margin: 8px 0;
      border-radius: 8px;
      text-align: center;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.3s;
    }
    .movie-item {
      background: rgba(255, 255, 255, 0.15);
    }
    .category:focus, .movie-item:focus {
      background: rgba(255, 255, 255, 0.3);
      outline: 3px solid #00e5ff;
      transform: scale(1.05);
    }
    .content-container {
      flex: 1;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 15px;
      padding: 20px;
      overflow-y: auto;
      justify-content: center;
    }
    .content-container img {
      width: 100%;
      height: 220px; /* طول الأفلام عادة يكون أكبر (Portrait) */
      object-fit: cover;
      border-radius: 8px;
      background-color: #222;
    }
  </style>
